name: Publish to Web Stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g., v2.0.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.release.tag_name }}

jobs:
  publish:
    name: Publish Extension to All Stores
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.tag_name != 'v2.0.0' && github.event.release.tag_name != '2.0.0') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Release Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Download original release zip artifacts (Zero-Rebuild)
          gh release download "$RELEASE_TAG" --dir dist --pattern "*.zip"
          ls -lh dist/

      # ─── Step 1: Chrome Web Store ───
      - name: Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          pnpm submit:chrome "dist/anonymous-story-viewer-${RELEASE_TAG}-chrome.zip"

      # ─── Step 2: Edge Add-ons ───
      - name: Publish to Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          pnpm submit:edge "dist/anonymous-story-viewer-${RELEASE_TAG}-chrome.zip"

      # ─── Step 3: Mozilla AMO ───
      - name: Publish to Mozilla AMO
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm submit:firefox "dist/anonymous-story-viewer-${RELEASE_TAG}-firefox.zip" \
            --firefox-sources-zip "dist/anonymous-story-viewer-${RELEASE_TAG}-sources.zip"
